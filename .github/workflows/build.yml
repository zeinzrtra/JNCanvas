name: Build JNCanvas (Windows x64 & Installer .exe)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSVC C++ Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.3'
        arch: 'win64_msvc2019_64'
        modules: 'qtbase'

    - name: Download & Setup OBS Studio SDK
      shell: bash
      run: |
        OBS_VERSION="30.2.3"
        echo "Fetching OBS Studio ${OBS_VERSION} development SDK..."
        curl -L -o obs-studio.zip "https://github.com/obsproject/obs-studio/releases/download/${OBS_VERSION}/OBS-Studio-${OBS_VERSION}-Windows.zip"
        7z x obs-studio.zip -o"C:/obs-studio" -y
        echo "OBS Studio extracted to C:/obs-studio"

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="C:/obs-studio;${{ env.Qt6_DIR }}" `
          -Dlibobs_DIR="C:/obs-studio/cmake/libobs" `
          -Dobs-frontend-api_DIR="C:/obs-studio/cmake/obs-frontend-api"

    - name: Build Plugin (Release)
      run: |
        cmake --build build --config Release

    - name: Prepare Package Files
      shell: bash
      run: |
        mkdir -p package/obs-plugins/64bit
        mkdir -p package/data/obs-plugins/jn-canvas
        cp build/Release/jn-canvas.dll package/obs-plugins/64bit/ || cp build/jn-canvas.dll package/obs-plugins/64bit/
        cd package && 7z a ../jn-canvas-windows-x64.zip *

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress --yes

    - name: Build Windows .exe Installer
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

    - name: Upload Installer (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: JNCanvas-Installer-Windows-x64
        path: installer_output/JNCanvas-Setup-v1.0.0-Windows-x64.exe
        retention-days: 14

    - name: Upload Portable Package (.zip)
      uses: actions/upload-artifact@v4
      with:
        name: JNCanvas-Portable-Windows-x64
        path: jn-canvas-windows-x64.zip
        retention-days: 14
